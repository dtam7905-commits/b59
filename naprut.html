
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B59CLUB - Nạp Rút</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090d18;
  color: white;
  font-family: Arial, sans-serif;
  padding: 18px;
}

.container {
  max-width: 480px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.header h2 {
  color: #ffd34e;
}

.back {
  color: white;
  text-decoration: none;
  background: #222b40;
  padding: 10px 15px;
  border-radius: 8px;
}

.balance {
  background: linear-gradient(135deg, #9b5b00, #edbd36);
  color: #17100a;
  padding: 22px;
  border-radius: 15px;
  margin-bottom: 22px;
}

.balance p {
  font-size: 14px;
}

.balance h1 {
  margin-top: 10px;
  font-size: 30px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.tabs button {
  flex: 1;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #202b40;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.tabs button.active {
  background: #e8ae28;
  color: #17100a;
}

.panel {
  background: #151e30;
  padding: 20px;
  border-radius: 15px;
}

.panel h3 {
  margin-bottom: 18px;
  color: #ffd34e;
}

label {
  display: block;
  margin: 14px 0 8px;
  color: #cbd3e3;
}

input, select {
  width: 100%;
  padding: 14px;
  border: 1px solid #35425c;
  background: #0c1424;
  color: white;
  border-radius: 9px;
  outline: none;
  font-size: 16px;
}

.quick {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}

.quick button {
  background: #263550;
  color: white;
  border: 1px solid #40516e;
  padding: 10px 4px;
  border-radius: 8px;
  cursor: pointer;
}

.submit {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(90deg, #e8a91d, #ffdb62);
  color: #211500;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
}

.note {
  color: #aebbd0;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 18px;
}

.message {
  margin-top: 15px;
  color: #ffd34e;
  text-align: center;
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h2>💎 B59CLUB</h2>
    <a class="back" href="sanh.html">← Trở về</a>
  </div>

  <div class="balance">
    <p>SỐ DƯ HIỆN TẠI</p>
    <h1 id="balance">0 xu</h1>
  </div>

  <div class="tabs">
    <button id="depositTab" class="active" onclick="showTab('deposit')">
      NẠP XU
    </button>
    <button id="withdrawTab" onclick="showTab('withdraw')">
      RÚT XU
    </button>
  </div>

  <div class="panel" id="depositPanel">
    <h3>💰 Nạp xu</h3>

    <label>Số xu muốn nạp</label>
    <input type="number" id="depositAmount" placeholder="Nhập số xu">

    <div class="quick">
      <button onclick="setAmount('depositAmount',10000)">10.000</button>
      <button onclick="setAmount('depositAmount',50000)">50.000</button>
      <button onclick="setAmount('depositAmount',100000)">100.000</button>
    </div>

    <button class="submit" onclick="deposit()">
      XÁC NHẬN NẠP
    </button>
  </div>

  <div class="panel" id="withdrawPanel" style="display:none">
    <h3>💸 Rút xu</h3>

    <label>Số xu muốn rút</label>
    <input type="number" id="withdrawAmount" placeholder="Nhập số xu">

    <label>Thông tin nhận</label>
    <input type="text" id="receiver" placeholder="Nhập thông tin tài khoản">

    <button class="submit" onclick="withdraw()">
      GỬI YÊU CẦU RÚT
    </button>
  </div>

  <p class="message" id="message"></p>

  <p class="note">
    Đây là giao diện mô phỏng nạp/rút xu để thử nghiệm.
    Chưa kết nối ngân hàng, ví điện tử hoặc hệ thống thanh toán thật.
  </p>

</div>

<script>
function getBalance() {
  return Number(localStorage.getItem("b59_balance") || 0);
}

function updateBalance() {
  document.getElementById("balance").innerText =
    getBalance().toLocaleString("vi-VN") + " xu";
}

function showTab(tab) {
  const deposit = tab === "deposit";

  document.getElementById("depositPanel").style.display =
    deposit ? "block" : "none";

  document.getElementById("withdrawPanel").style.display =
    deposit ? "none" : "block";

  document.getElementById("depositTab").classList.toggle("active", deposit);
  document.getElementById("withdrawTab").classList.toggle("active", !deposit);

  document.getElementById("message").innerText = "";
}

function setAmount(id, amount) {
  document.getElementById(id).value = amount;
}

function deposit() {
  const amount = Number(document.getElementById("depositAmount").value);

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Vui lòng nhập số xu hợp lệ!");
    return;
  }

  // Mô phỏng cộng xu để kiểm tra giao diện
  localStorage.setItem("b59_balance", getBalance() + amount);

  updateBalance();
  document.getElementById("depositAmount").value = "";
  document.getElementById("message").innerText =
    "Đã cộng xu mô phỏng thành công!";
}

function withdraw() {
  const amount = Number(document.getElementById("withdrawAmount").value);
  const receiver = document.getElementById("receiver").value.trim();

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Vui lòng nhập số xu hợp lệ!");
    return;
  }

  if (amount > getBalance()) {
    alert("Số dư không đủ!");
    return;
  }

  if (!receiver) {
    alert("Vui lòng nhập thông tin nhận!");
    return;
  }

  localStorage.setItem("b59_balance", getBalance() - amount);

  updateBalance();

  document.getElementById("withdrawAmount").value = "";
  document.getElementById("receiver").value = "";

  document.getElementById("message").innerText =
    "Đã trừ xu mô phỏng thành công!";
}

updateBalance();
  const tab = new URLSearchParams(location.search).get("tab");

if (tab === "withdraw") {
  showTab("withdraw");
} else {
  showTab("deposit");
}
</script>
</body>
</html>
