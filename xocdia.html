<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B59CLUB - Xóc Đĩa</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(circle at top,#174b3b,#061711);
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#09251e;
 border-bottom:2px solid #c9a64c;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{color:#f5d477;font-size:23px;font-weight:bold}
a{color:#f5d477;text-decoration:none;font-weight:bold}
.balance{
 margin:15px auto;
 padding:13px;
 max-width:500px;
 text-align:center;
 background:#12372b;
 border:1px solid #c9a64c;
 border-radius:12px;
}
.balance strong{
 display:block;
 color:#ffdf75;
 font-size:24px;
 margin-top:5px;
}
.container{max-width:500px;margin:auto;padding:12px}
.table{
 background:linear-gradient(145deg,#176247,#0b392b);
 border:5px solid #b28c3d;
 border-radius:22px;
 padding:15px;
 text-align:center;
}
h2{color:#ffdf83}
.bowl-area{
 height:210px;
 display:flex;
 justify-content:center;
 align-items:center;
 position:relative;
}
.plate{
 width:185px;
 height:185px;
 border-radius:50%;
 background:#e6ddc8;
 display:flex;
 justify-content:center;
 align-items:center;
 flex-wrap:wrap;
 gap:12px;
 padding:30px;
 box-shadow:0 10px 20px #0008;
}
.coin{
 width:43px;
 height:43px;
 border-radius:50%;
 border:3px solid white;
 box-shadow:0 3px 6px #3338;
}
.red{background:#d00020}
.white{background:#f5f5ed}
.bowl{
 display:none;
 position:absolute;
 width:205px;
 height:170px;
 border-radius:50%;
 background:linear-gradient(135deg,#fff,#888,#eee);
 border:7px solid #c9a64c;
 box-shadow:0 12px 18px #0008;
}
.bowl.show{display:block}
.bowl:after{
 content:"B59";
 position:absolute;
 inset:0;
 display:grid;
 place-items:center;
 color:#a47b29;
 font-size:30px;
 font-weight:bold;
}
.shaking{animation:shake .12s infinite alternate}
@keyframes shake{
 from{transform:rotate(-5deg) translateX(-5px)}
 to{transform:rotate(5deg) translateX(5px)}
}
.status{
 color:#ffdf83;
 font-weight:bold;
 min-height:25px;
 margin:8px;
}
button{
 cursor:pointer;
}
.action{
 background:linear-gradient(#ffe79b,#c99b39);
 border:0;
 border-radius:10px;
 padding:13px 18px;
 font-weight:bold;
 margin:5px;
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:15px;
}
.bet{
 background:#12372c;
 border:2px solid #9b8244;
 color:white;
 border-radius:12px;
 padding:13px 5px;
 font-weight:bold;
}
.bet span{
 display:block;
 color:#f7d77c;
 font-size:12px;
 margin-top:5px;
}
.bet.selected{
 background:#8b2225;
 border-color:#ffe18a;
}
.chips{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:8px;
 margin:15px 0;
}
.chip{
 width:48px;
 height:48px;
 border-radius:50%;
 border:2px solid #d9c17d;
 font-weight:bold;
}
.chip.active{background:#f3c84e}
.info{
 background:#102b23;
 padding:13px;
 border-radius:12px;
 margin-top:15px;
}
.row{
 display:flex;
 justify-content:space-between;
 margin:9px 0;
}
.history{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:10px;
}
.tag{
 background:#315144;
 padding:7px;
 border-radius:7px;
 font-size:12px;
}
</style>
</head>

<body>

<header>
<a href="sanh.html">‹ SẢNH</a>
<div class="logo">B59CLUB</div>
<b style="color:#f5d477">XÓC ĐĨA</b>
</header>

<div class="balance">
SỐ DƯ XU ẢO
<strong id="balance">1.000.000 xu</strong>
</div>

<div class="container">

<div class="table">
<h2>🎲 XÓC ĐĨA 🎲</h2>

<div class="bowl-area">
<div class="plate" id="plate">
<div class="coin red"></div>
<div class="coin white"></div>
<div class="coin red"></div>
<div class="coin white"></div>
</div>
<div class="bowl show" id="bowl"></div>
</div>

<div class="status" id="status">
Chọn cửa cược để bắt đầu
</div>

<button class="action" id="playBtn" onclick="play()">
LẮC VÀ MỞ BÁT
</button>

<button class="action" onclick="cancelBet()">
HỦY CƯỢC
</button>
</div>

<div class="grid">
<button class="bet" onclick="choose('chan',this)">
CHẴN
<span>2 đỏ - 2 trắng hoặc 4 cùng màu</span>
</button>

<button class="bet" onclick="choose('le',this)">
LẺ
<span>1 đỏ - 3 trắng hoặc 3 đỏ - 1 trắng</span>
</button>

<button class="bet" onclick="choose('do2',this)">
2 ĐỎ 2 TRẮNG
<span>Đúng 2 quân đỏ</span>
</button>

<button class="bet" onclick="choose('do3',this)">
3 ĐỎ 1 TRẮNG
<span>Đúng 3 quân đỏ</span>
</button>

<button class="bet" onclick="choose('do4',this)">
4 ĐỎ
<span>Cả 4 quân đỏ</span>
</button>

<button class="bet" onclick="choose('trang4',this)">
4 TRẮNG
<span>Cả 4 quân trắng</span>
</button>
</div>

<div class="chips">
<button class="chip active" onclick="setChip(5000,this)">5K</button>
<button class="chip" onclick="setChip(10000,this)">10K</button>
<button class="chip" onclick="setChip(50000,this)">50K</button>
<button class="chip" onclick="setChip(100000,this)">100K</button>
<button class="chip" onclick="setChip(200000,this)">200K</button>
</div>

<div class="info">
<div class="row">
<span>Cửa đã chọn</span>
<b id="choice">Chưa chọn</b>
</div>

<div class="row">
<span>Mức cược</span>
<b id="stake">5.000 xu</b>
</div>

<div class="row">
<span>Tiền đang cược</span>
<b id="currentBet">0 xu</b>
</div>

<div class="row">
<span>Kết quả</span>
<b id="lastResult">Chưa có</b>
</div>

<div class="history" id="history"></div>
</div>

<p style="text-align:center;color:#9eb5a9;font-size:11px">
Game mô phỏng giải trí bằng xu ảo.
</p>

</div>

<script>
const KEY='b59_balance';

let balance=localStorage.getItem(KEY)===null
 ?1000000:Number(localStorage.getItem(KEY));

let selected='';
let chip=5000;
let stake=0;
let locked=false;
let history=[];

const names={
 chan:'Chẵn',
 le:'Lẻ',
 do2:'2 đỏ 2 trắng',
 do3:'3 đỏ 1 trắng',
 do4:'4 đỏ',
 trang4:'4 trắng'
};

function format(n){
 return Math.floor(n).toLocaleString('vi-VN')+' xu';
}

function update(){
 localStorage.setItem(KEY,String(balance));
 document.getElementById('balance').textContent=format(balance);
}

function choose(type,button){
 if(locked||stake>0)return;

 selected=type;

 document.querySelectorAll('.bet').forEach(b=>{
  b.classList.remove('selected');
 });

 button.classList.add('selected');

 document.getElementById('choice').textContent=names[type];
}

function setChip(value,button){
 if(locked||stake>0)return;

 chip=value;

 document.querySelectorAll('.chip').forEach(b=>{
  b.classList.remove('active');
 });

 button.classList.add('active');

 document.getElementById('stake').textContent=format(chip);
}

function cancelBet(){
 if(locked)return;

 if(stake>0){
  balance+=stake;
  stake=0;
  update();
 }

 selected='';

 document.querySelectorAll('.bet').forEach(b=>{
  b.classList.remove('selected');
 });

 document.getElementById('choice').textContent='Chưa chọn';
 document.getElementById('currentBet').textContent=format(0);
 document.getElementById('status').textContent='Đã hủy cược';
}

function play(){
 if(locked)return;

 if(!selected){
  document.getElementById('status').textContent='Hãy chọn cửa cược!';
  return;
 }

 if(balance<chip){
  document.getElementById('status').textContent='Số dư không đủ!';
  return;
 }

 balance-=chip;
 stake=chip;
 update();

 locked=true;

 document.getElementById('currentBet').textContent=format(stake);

 const bowl=document.getElementById('bowl');
 const plate=document.getElementById('plate');
 const btn=document.getElementById('playBtn');

 btn.disabled=true;

 document.getElementById('status').textContent='Đang xóc đĩa...';

 bowl.classList.add('shaking');

 setTimeout(()=>{
  bowl.classList.remove('shaking');
  bowl.classList.remove('show');

  // Tạo ngẫu nhiên 4 quân: đỏ hoặc trắng
  let reds=Math.floor(Math.random()*5);

  let colors=[
   ...Array(reds).fill('red'),
   ...Array(4-reds).fill('white')
  ];

  colors.sort(()=>Math.random()-.5);

  plate.innerHTML=colors.map(color=>
   `<div class="coin ${color}"></div>`
  ).join('');

  let label=[
   '4 trắng',
   '1 đỏ 3 trắng',
   '2 đỏ 2 trắng',
   '3 đỏ 1 trắng',
   '4 đỏ'
  ][reds];

  let win=
   (selected==='chan'&&reds%2===0)||
   (selected==='le'&&reds%2===1)||
   (selected==='do2'&&reds===2)||
   (selected==='do3'&&reds===3)||
   (selected==='do4'&&reds===4)||
   (selected==='trang4'&&reds===0);

  // Thắng Chẵn/Lẻ nhận tổng 2 lần tiền cược.
  // Các cửa đúng số quân nhận tổng 4 lần tiền cược.
  let multiplier=
   selected==='chan'||selected==='le'?2:4;

  let payout=win?stake*multiplier:0;

  balance+=payout;
  update();

  document.getElementById('status').textContent=
   win
   ?'🎉 '+label+' - THẮNG '+format(payout-stake)
   :'Kết quả: '+label+' - Chúc bạn may mắn lần sau!';

  document.getElementById('lastResult').textContent=label;

  history.unshift(label);
  history=history.slice(0,10);

  document.getElementById('history').innerHTML=
   history.map(item=>`<span class="tag">${item}</span>`).join('');

  stake=0;

  document.getElementById('currentBet').textContent=format(0);

  locked=false;
  btn.disabled=false;

 },1800);
}

update();
</script>

</body>
</html>
